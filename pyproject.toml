[project]
name = "ag-tokens-inspector"
dynamic = ["version"]
description = "A token inspect tool for Antigravity"
readme = "README.md"
authors = [{ name = "Martin", email = "qule520@126.com" }]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ag-tokens-inspector = "ag_tokens_inspector.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "https://github.com/ecator/ag-tokens-inspector"
Repository = "https://github.com/ecator/ag-tokens-inspector"


[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
